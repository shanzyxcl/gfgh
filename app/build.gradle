apply plugin: 'com.android.application'
apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'com.google.gms.google-services'

android {
    signingConfigs {
        release {
            storeFile file('KeyApp.jks')
            storePassword 'Mailojoya2020'
            keyAlias 'mrx470'
            keyPassword 'Mailojoya2020'
        }
    }
    compileSdk 35
    namespace "com.fenix.vpn"

    defaultConfig {
        applicationId "com.fenix.vpn"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 167
        versionName "16.2"
        multiDexEnabled false
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

// Configuration
    BlackObfuscator {
        enabled true
        depth 5
        obfClass = ["com.fenix"]
        blackClass = ["top.niunaijun.black"]
    }


}

allprojects {
    repositories {
        maven { url = 'https://jitpack.io' }
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'com.pnikosis:materialish-progress:1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.android.support:customtabs:28.0.0'
    implementation 'androidx.browser:browser:1.5.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'com.google.android.play:app-update:2.1.0'
    //implementation 'com.google.android.play:core:1.10.3'
    // support libs
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    // outros
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    //nuevo wifi shared
    implementation 'com.github.gabriel-TheCode:AestheticDialogs:1.3.6'
    implementation 'com.valdesekamdem.library:md-toast:0.9.0'
    implementation 'org.connectbot.jbcrypt:jbcrypt:1.0.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.github.doctoror.particlesdrawable:library:1.0.9'
    implementation project(':style')
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-inappmessaging-display:21.0.1'
    implementation("net.orandja.shadowlayout:shadowlayout:1.0.1")
    implementation 'com.github.dmytrodanylyk.shadow-layout:library:1.0.3'
    /// implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'cn.pedant.sweetalert:library:1.3'
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    // root detect
    implementation 'com.github.kimchangyoun:rootbeerFresh:+'
    implementation 'com.sdsmdg.tastytoast:tastytoast:0.1.1'

}
